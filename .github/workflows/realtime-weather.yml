name: Generate realtime weather bundles

on:
  schedule:
    # 每 15 分鐘一次（偏移 +8 分鐘，讓氣象署先發布、留校對窗口）。
    - cron: '8,23,38,53 * * * *'
  workflow_dispatch:

concurrency:
  group: realtime-weather
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate realtime weather bundles
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
          MOENV_API_KEY: ${{ secrets.MOENV_API_KEY }}
        run: node scripts/generate-realtime-weather.mjs

      - name: Upload bundles to Cloudflare KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WEATHER_KV_NAMESPACE_ID: ${{ secrets.WEATHER_KV_NAMESPACE_ID }}
        run: |
          set -euo pipefail
          for file in artifacts/realtime/*.json; do
            key="$(basename "$file" .json | tr '-' ':')"
            echo "Uploading $key from $file"
            # wrangler v4 的 kv 指令預設寫入本機 Miniflare；未加 --remote 只會「假成功」而不會更新正式 KV。
            npx --yes wrangler@4 kv key put "$key" --path "$file" --namespace-id "$WEATHER_KV_NAMESPACE_ID" --remote
          done

      - name: Verify remote KV bundles
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WEATHER_KV_NAMESPACE_ID: ${{ secrets.WEATHER_KV_NAMESPACE_ID }}
        run: |
          set -euo pipefail
          for file in artifacts/realtime/*.json; do
            key="$(basename "$file" .json | tr '-' ':')"
            remote_file="$(mktemp)"
            if ! npx --yes wrangler@4 kv key get "$key" --namespace-id "$WEATHER_KV_NAMESPACE_ID" --remote --text > "$remote_file"; then
              echo "Remote KV read failed for $key"
              rm -f "$remote_file"
              exit 1
            fi
            # 以 JSON 解析驗證遠端 bundle（不依賴序列化空白）；只輸出 key 與時間戳，不輸出完整資料。
            node -e '
            const fs = require("node:fs");
            const [expectedPath, remotePath, key] = process.argv.slice(1);
            const readJson = (path) => { try { return JSON.parse(fs.readFileSync(path, "utf8")); } catch { return undefined; } };
            const validTimestamp = (value) => typeof value === "string" && value.length > 0 && !Number.isNaN(Date.parse(value));
            const expected = readJson(expectedPath);
            const remote = readJson(remotePath);
            if (!remote || typeof remote !== "object" || !remote.meta) {
              console.error(`verify failed: remote ${key} is not a valid bundle JSON or is missing meta`);
              process.exit(1);
            }
            const remoteAt = remote.meta.generatedAt;
            const expectedAt = expected && expected.meta ? expected.meta.generatedAt : undefined;
            if (!validTimestamp(expectedAt)) {
              console.error(`verify failed: local ${key} is missing a valid meta.generatedAt`);
              process.exit(1);
            }
            if (!validTimestamp(remoteAt)) {
              console.error(`verify failed: remote ${key} is missing a valid meta.generatedAt`);
              process.exit(1);
            }
            if (remoteAt !== expectedAt) {
              console.error(`verify failed: remote ${key} generatedAt=${remoteAt} does not match expected ${expectedAt}`);
              process.exit(1);
            }
            console.log(`verified ${key} generatedAt=${remoteAt}`);
            ' "$file" "$remote_file" "$key"
            rm -f "$remote_file"
          done