name: Generate realtime weather bundles

on:
  schedule:
    # 每 15 分鐘一次（偏移 +8 分鐘，讓氣象署先發布、留校對窗口）。
    - cron: '8,23,38,53 * * * *'
  workflow_dispatch:

concurrency:
  group: realtime-weather
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate realtime weather bundles
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
          MOENV_API_KEY: ${{ secrets.MOENV_API_KEY }}
        run: node scripts/generate-realtime-weather.mjs

      - name: Upload bundles to Cloudflare KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WEATHER_KV_NAMESPACE_ID: ${{ secrets.WEATHER_KV_NAMESPACE_ID }}
        run: |
          set -e
          for file in artifacts/realtime/*.json; do
            key="$(basename "$file" .json | tr '-' ':')"
            echo "Uploading $key from $file"
            npx --yes wrangler@4 kv key put "$key" --path "$file" --namespace-id "$WEATHER_KV_NAMESPACE_ID"
          done